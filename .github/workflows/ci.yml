name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      TURSO_DATABASE_URL: http://127.0.0.1:8080
      TURSO_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: uicapsule-ci-only-secret-for-static-checks
      NEXT_PUBLIC_ASSETS_URL: https://d24l2zb4cwkekfpl.public.blob.vercel-storage.com
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      # the web build runs through `dotenv -e ../../.env`, which exits non-zero on a missing file
      - run: touch .env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
