packages:
  - apps/*
  - packages/*
  - content/*

catalog:
  "@base-ui/react": ^1.8.0
  "@better-auth/cli": ^1.4.21
  # In lockstep with better-auth: auth.ts imports its relations-v2 entry directly.
  "@better-auth/drizzle-adapter": ^1.7.5
  "@kyh/tsconfig": ^1.2.0
  "@orpc/client": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.2.2
  "@tanstack/react-form": ^1.28.5
  "@tanstack/react-query": ^5.103.1
  "@types/node": ^24.13.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^5.2.0
  better-auth: ^1.7.5
  cn: ^0.3.0
  drizzle-orm: 1.0.0-rc.4
  next: ^16.3.5
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^7.3.1
  zod: ^4.6.5

linkWorkspacePackages: true

allowBuilds:
  # Unused optional peer of @better-auth/cli; this repo is on drizzle.
  "@prisma/engines": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  es5-ext: true
  esbuild: true
  prisma: false
  sharp: true
