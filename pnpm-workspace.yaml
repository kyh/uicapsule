packages:
  - apps/*
  - packages/*
  - content/*

catalog:
  "@base-ui/react": ^1.9.0
  # In lockstep with better-auth: auth.ts imports its relations-v2 entry directly.
  "@better-auth/drizzle-adapter": ^1.7.27
  "@kyh/tsconfig": ^1.3.0
  "@orpc/client": 2.0.0-beta.45
  "@orpc/contract": 2.0.0-beta.45
  "@orpc/mcp": 2.0.0-beta.45
  "@orpc/server": 2.0.0-beta.45
  "@orpc/tanstack-query": 2.0.0-beta.45
  "@tailwindcss/postcss": ^4.3.5
  "@tailwindcss/vite": ^4.2.2
  "@tanstack/react-form": ^1.28.5
  "@tanstack/react-query": ^5.108.2
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  # eve's peer: the request builder's tools type against its model output
  ai: ^7.0.179
  better-auth: ^1.7.27
  cn: ^0.4.0
  # drizzle-kit must match drizzle-orm exactly.
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  # Exact: the request builder (apps/web/agent) is written against this release's docs, and its
  # session store strands a running session on an upgrade.
  eve: 1.5.0
  lucide-react: ^1.77.0
  motion: ^14.14.0
  next: ^16.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  tsx: ^4.23.15
  typescript: ^7.0.2
  vite: ^8.3.8
  zod: ^4.6.7

linkWorkspacePackages: true

allowBuilds:
  # Unused optional peer of @better-auth/cli; this repo is on drizzle.
  "@prisma/engines": false
  "@tailwindcss/oxide": true
  esbuild: true
  prisma: false
  sharp: true

minimumReleaseAgeExclude:
  - "@orpc/client@2.0.0-beta.45"
  - "@orpc/contract@2.0.0-beta.45"
  - "@orpc/json-schema@2.0.0-beta.45"
  - "@orpc/mcp@2.0.0-beta.45"
  - "@orpc/openapi@2.0.0-beta.45"
  - "@orpc/server@2.0.0-beta.45"
  - "@orpc/shared@2.0.0-beta.45"
  - "@orpc/tanstack-query@2.0.0-beta.45"

ignoredOptionalDependencies:
  - "@mongodb-js/zstd"
  - "node-liblzma"
